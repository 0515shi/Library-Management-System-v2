spring:
  application:
    name: Library Management System

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/library-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/lib
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect